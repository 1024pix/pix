<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Pix Orga tests</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        dialog:modal {
          position: fixed;
          inset: auto 0 0 auto;   /* bas-droite, comme #ember-testing-container */
          width: 640px;
          height: 384px;
          max-width: 640px;
          max-height: 384px;
          margin: 0;
        }

        dialog:modal::backdrop {
          background: transparent;   /* le backdrop couvre toujours tout le
        viewport */
        }
    </style>


    {{content-for "head"}} {{content-for "test-head"}}

    <link rel="stylesheet" href="/@embroider/virtual/vendor.css" />
    <link rel="stylesheet" href="/@embroider/virtual/app.css" />
    <link rel="stylesheet" href="/@embroider/virtual/test-support.css" />

    {{content-for "head-footer"}} {{content-for "test-head-footer"}}
  </head>
  <body>
    {{content-for "body"}} {{content-for "test-body"}}

    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <script src="/testem.js" integrity="" data-embroider-ignore></script>
    <script src="/@embroider/virtual/vendor.js"></script>
    <script src="/@embroider/virtual/test-support.js"></script>

    <script type="module">
      import "ember-testing";
    </script>
    <script type="module">
      import { start } from "./test-helper.js";

      const availableModules = {
        ...import.meta.glob("./acceptance/**/*-test.{js,ts,gjs,gts}"),
        ...import.meta.glob("./integration/**/*-test.{js,ts,gjs,gts}"),
        ...import.meta.glob("./unit/**/*-test.{js,ts,gjs,gts}"),
      };

      start({ availableModules });
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
