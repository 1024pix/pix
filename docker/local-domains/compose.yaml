services:
  caddy:
    container_name: caddy
    image: caddy:latest@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443
      - 127.0.0.1:443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - API_HOST=host.docker.internal
    networks:
      pix_local:
        # creates aliases for other containers connected to pix_local
        aliases:
          - app.dev.pix.fr
          - app.dev.pix.org
          - orga.dev.pix.fr
          - orga.dev.pix.org
          - admin.dev.pix.fr
          - admin.dev.pix.org
          - certif.dev.pix.fr
          - certif.dev.pix.org
          - junior.dev.pix.fr
          - junior.dev.pix.org
          - auth.dev.pix.fr
          - auth.dev.pix.org

volumes:
  caddy_data:
  caddy_config:

networks:
  pix_local:
    # makes this network available to other compose files under the name pix_local
    name: pix_local
