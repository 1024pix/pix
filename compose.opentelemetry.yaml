services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    container_name: pix-api-jaeger
    command: ['--config', 'file:/etc/jaeger/config.yaml']
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      # UI, see docs/en/OpenTelemetry.md
      - '${PIX_JAEGER_UI_PORT:-16686}:16686'
      # OTLP over HTTP, the protocol used by the API exporters
      - '${PIX_JAEGER_OTLP_PORT:-4318}:4318'
