apiVersion: apps/v1
kind: Deployment
metadata:
  name: orga
  namespace: pix
  labels:
    app: orga
    app.kubernetes.io/name: orga
    app.kubernetes.io/part-of: pix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orga
  template:
    metadata:
      labels:
        app: orga
    spec:
      volumes:
        - name: config
          configMap:
            name: nginx-config
            items:
              - key: "nginx.conf"
                path: "default.conf"
      containers:
        - name: orga
          image: pix-orga:dev
          imagePullPolicy: Never
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/
              name: config
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: orga-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orga
  namespace: pix
  labels:
    app: orga
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: orga
