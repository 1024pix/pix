apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-mock
  namespace: pix
  labels:
    app: s3-mock
    app.kubernetes.io/name: s3-mock
    app.kubernetes.io/part-of: pix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-mock
  template:
    metadata:
      labels:
        app: s3-mock
    spec:
      containers:
        - name: s3-mock
          image: adobe/s3mock:4.11.0
          ports:
            - containerPort: 9090
          env:
            - name: initialBuckets
              value: "pix-import-dev,pix-import-test"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: s3-mock
  namespace: pix
  labels:
    app: s3-mock
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: s3-mock
