services:
  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  prometheus-pushgateway:
    image: prom/pushgateway:v1
    ports:
      - '${PIX_PROMETHEUS_PUSHGATEWAY_PORT:-9991}:9091'
  grafana:
    image: grafana/grafana:13.2
    ports:
      - '${PIX_GRAFANA_PORT:-3210}:3000'
