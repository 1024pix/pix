name: 'Security Checks'

## For readability and asynchronicity, the code for all 10 jobs is not in a loop


on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths: # only loads on changes of dependencies
      - '**/package-lock.json'
      - '.github/workflows/security.yml'

permissions: {}

jobs:

  check_risk_score_monorepo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreMonorepo.outputs.riskscore }}
      status: ${{ steps.riskscoreMonorepo.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates Monorepo SBoM and upload to OWASP DTrack
        id: riskscoreMonorepo
        uses:  1024pix/check-dependency-track-action/node@b9c616bc8284c29d1d37299343a0b486002de68b
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: '.'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of the Monorepo is ${{ steps.riskscoreMonorepo.outputs.riskscore }}"

  check_risk_score_app:
