name: 'Security Checks'

on:
  push:
    branches:
      - dev

jobs:

  check_risk_score_monorepo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreMonorepo.outputs.riskscore }}
      status: ${{ steps.riskscoreMonorepo.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscoreMonorepo
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: '.'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of the Monorepo is ${{ steps.riskscoreMonorepo.outputs.riskscore }}"

  check_risk_score_app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixApp.outputs.riskscore }}
      status: ${{ steps.riskscorePixApp.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixApp
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'mon-pix'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix App is ${{ steps.riskscorePixApp.outputs.riskscore }}"

  check_risk_score_orga:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixOrga.outputs.riskscore }}
