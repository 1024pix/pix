        with:
          persist-credentials: false

      - name: Generates PixCertif SBoM and upload to OWASP DTrack
        id: riskscorePixCertif
        uses: 1024pix/check-dependency-track-action/node@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'certif'
          wait_for_status: 'false'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'

  check_risk_score_admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.riskscorePixAdmin.outputs.upload_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generates PixAdmin SBoM and upload to OWASP DTrack
        id: riskscorePixAdmin
