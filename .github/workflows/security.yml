      - name: Generates PixOrga SBoM and upload to OWASP DTrack
        id: riskscorePixOrga
        uses: 1024pix/check-dependency-track-action/node@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
