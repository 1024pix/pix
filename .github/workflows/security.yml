  comment_on_pr:
    runs-on: ubuntu-latest
    needs: 
        - check_risk_score_monorepo
        - check_risk_score_app
        - check_risk_score_orga
        - check_risk_score_certif
        - check_risk_score_admin
        - check_risk_score_junior
        - check_risk_score_api
        - check_risk_score_audit_logger
        - check_risk_score_tests_e2e
        - check_risk_score_tests_playwright
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - id: fetch all scores
        uses: 1024pix/check-dependency-track-action/fetch@b9c616bc8284c29d1d37299343a0b486002de68b
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          projects: |
            ${{ needs.check_risk_score_monorepo.outputs.upload }}
            ${{ needs.check_risk_score_app.outputs.upload }}
            ${{ needs.check_risk_score_orga.outputs.upload }}
            ${{ needs.check_risk_score_certif.outputs.upload }}
            ${{ needs.check_risk_score_admin.outputs.upload }}
            ${{ needs.check_risk_score_junior.outputs.upload }}
            ${{ needs.check_risk_score_api.outputs.upload }}
            ${{ needs.check_risk_score_audit_logger.outputs.upload }}
            ${{ needs.check_risk_score_tests_e2e.outputs.upload }}
            ${{ needs.check_risk_score_tests_playwright.outputs.upload }}

  comment_on_pr:
    runs-on: ubuntu-latest
    needs: fetch_results
    if: ${{ !cancelled() && needs.fetch_results.outputs.status != '' }}
    permissions:
      pull-requests: write
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          MARKDOWN_TABLE: ${{ needs.fetch_results.outputs.markdown }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$MD" > "$RUNNER_TEMP/body.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body-file "$RUNNER_TEMP/body.md"

