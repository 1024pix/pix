    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixJunior.outputs.riskscore }}
      status: ${{ steps.riskscorePixJunior.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
