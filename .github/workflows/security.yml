    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixOrga
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'orga'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix Orga is ${{ steps.riskscorePixOrga.outputs.riskscore }}"

  check_risk_score_certif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixCertif.outputs.riskscore }}
      status: ${{ steps.riskscorePixCertif.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixCertif
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'certif'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix Certif is ${{ steps.riskscorePixCertif.outputs.riskscore }}"

  check_risk_score_admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixAdmin.outputs.riskscore }}
      status: ${{ steps.riskscorePixAdmin.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixAdmin
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'admin'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix Admin is ${{ steps.riskscorePixAdmin.outputs.riskscore }}"

  check_risk_score_junior:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixJunior.outputs.riskscore }}
      status: ${{ steps.riskscorePixJunior.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixJunior
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'junior'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix Junior is ${{ steps.riskscorePixJunior.outputs.riskscore }}"

  check_risk_score_api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscorePixAPI.outputs.riskscore }}
      status: ${{ steps.riskscorePixAPI.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscorePixAPI
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'api'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of the API is ${{ steps.riskscorePixAPI.outputs.riskscore }}"

  check_risk_score_audit_logger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreAuditLogger.outputs.riskscore }}
      status: ${{ steps.riskscoreAuditLogger.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscoreAuditLogger
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'audit-logger'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of Pix Audit Logger is ${{ steps.riskscoreAuditLogger.outputs.riskscore }}"

  check_risk_score_tests_e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreTestsE2E.outputs.riskscore }}
      status: ${{ steps.riskscoreTestsE2E.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscoreTestsE2E
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'high-level-tests/e2e'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of the E2E Tests is ${{ steps.riskscoreTestsE2E.outputs.riskscore }}"

  check_risk_score_tests_playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreTestsPlaywright.outputs.riskscore }}
      status: ${{ steps.riskscoreTestsPlaywright.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false

      - name: Generates BoM and upload to OWASP DTrack
        id: riskscoreTestsPlaywright
        uses:  1024pix/check-dependency-track-action/node@2fb2dd00c2dbb4db6340c4f95c91524eeea30312
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'high-level-tests/e2e-playwright'
          node_version: '22.14.0'
          basic_user: '${{ secrets.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
      
      - name: Get the risk score
        run: echo "The risk score of the Playwright Tests is ${{ steps.riskscoreTestsPlaywright.outputs.riskscore }}"

  comment_on_pr:
    runs-on: ubuntu-latest
    needs: 
        - check_risk_score_monorepo
        - check_risk_score_app
        - check_risk_score_orga
        - check_risk_score_certif
        - check_risk_score_admin
        - check_risk_score_junior
        - check_risk_score_api
        - check_risk_score_audit_logger
        - check_risk_score_tests_e2e
        - check_risk_score_tests_playwright
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.check_risk_score.outputs.status != '' }}
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MONOREPO_SCORE: ${{ needs.check_risk_score_monorepo.riskscore }}
          MONOREPO_STATUS: ${{ needs.check_risk_score_monorepo.status }}
          PIX_APP_SCORE: ${{ needs.check_risk_score_app.riskscore }}
          PIX_APP_STATUS: ${{ needs.check_risk_score_app.status }}
          PIX_ORGA_SCORE: ${{ needs.check_risk_score_orga.riskscore }}
          PIX_ORGA_STATUS: ${{ needs.check_risk_score_orga.status }}
          PIX_CERTIF_SCORE: ${{ needs.check_risk_score_certif.riskscore }}
          PIX_CERTIF_STATUS: ${{ needs.check_risk_score_certif.status }}
          PIX_ADMIN_SCORE: ${{ needs.check_risk_score_admin.riskscore }}
          PIX_ADMIN_STATUS: ${{ needs.check_risk_score_admin.status }}
          PIX_JUNIOR_SCORE: ${{ needs.check_risk_score_junior.riskscore }}
          PIX_JUNIOR_STATUS: ${{ needs.check_risk_score_junior.status }}
          PIX_API_SCORE: ${{ needs.check_risk_score_api.riskscore }}
          PIX_API_STATUS: ${{ needs.check_risk_score_api.status }}
          PIX_AUDIT_LOGGER_SCORE: ${{ needs.check_risk_score_audit_logger.riskscore }}
          PIX_AUDIT_LOGGER_STATUS: ${{ needs.check_risk_score_audit_logger.status }}
          TESTS_E2E_SCORE: ${{ needs.check_risk_score_tests_e2e.riskscore }}
          TESTS_E2E_STATUS: ${{ needs.check_risk_score_tests_e2e.status }}
          TESTS_PLAYWRIGHT_SCORE: ${{ needs.check_risk_score_tests_playwright.riskscore }}
          TESTS_PLAYWRIGHT_STATUS: ${{ needs.check_risk_score_tests_playwright.status }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "### Dependency-Track\n| Project | Status | RiskScore |\n|---|---|---|\n| MONOREPO | $MONOREPO_SCORE | $MONOREPO_STATUS |\n| PIX_APP | $PIX_APP_SCORE | $PIX_APP_STATUS |\n| PIX_ORGA | $PIX_ORGA_SCORE | $PIX_ORGA_STATUS |\n| PIX_CERTIF | $PIX_CERTIF_SCORE | $PIX_CERTIF_STATUS |\n| PIX_ADMIN | $PIX_ADMIN_SCORE | $PIX_ADMIN_STATUS |\n| PIX_JUNIOR | $PIX_JUNIOR_SCORE | $PIX_JUNIOR_STATUS |\n| PIX_API | $PIX_API_SCORE | $PIX_API_STATUS |\n| PIX_AUDIT_LOGGER | $PIX_AUDIT_LOGGER_SCORE | $PIX_AUDIT_LOGGER_STATUS |\n| TESTS_E2E | $TESTS_E2E_SCORE | $TESTS_E2E_STATUS |\n| TESTS_PLAYWRIGHT | $TESTS_PLAYWRIGHT_SCORE | $TESTS_PLAYWRIGHT_STATUS |\n"

