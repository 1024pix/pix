    permissions:
      contents: read
    outputs:
      upload: ${{ steps.riskscoreTestsE2E.outputs.upload_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
