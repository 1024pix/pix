      - name: Generates TestsE2E SBoM and upload to OWASP DTrack
        id: riskscoreTestsE2E
        uses: 1024pix/check-dependency-track-action/node@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'high-level-tests/e2e'
          wait_for_status: 'false'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'

  check_risk_score_tests_playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.riskscoreTestsPlaywright.outputs.upload_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generates TestsPlaywright SBoM and upload to OWASP DTrack
        id: riskscoreTestsPlaywright
        uses: 1024pix/check-dependency-track-action/node@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: 'high-level-tests/e2e-playwright'
          wait_for_status: 'false'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'

  fetch_results:
    runs-on: ubuntu-latest
    needs:
      - check_risk_score_monorepo
      - check_risk_score_app
      - check_risk_score_orga
      - check_risk_score_certif
      - check_risk_score_admin
      - check_risk_score_junior
      - check_risk_score_api
      - check_risk_score_audit_logger
      - check_risk_score_tests_e2e
      - check_risk_score_tests_playwright
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    outputs:
      status: ${{ steps.fetch_all_scores.outputs.status }}
      markdown: ${{ steps.fetch_all_scores.outputs.markdown }}
    steps:
      - id: fetch_all_scores
        uses: 1024pix/check-dependency-track-action/fetch@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'
          projects: |
            ${{ needs.check_risk_score_monorepo.outputs.upload }}
            ${{ needs.check_risk_score_app.outputs.upload }}
            ${{ needs.check_risk_score_orga.outputs.upload }}
            ${{ needs.check_risk_score_certif.outputs.upload }}
            ${{ needs.check_risk_score_admin.outputs.upload }}
            ${{ needs.check_risk_score_junior.outputs.upload }}
            ${{ needs.check_risk_score_api.outputs.upload }}
            ${{ needs.check_risk_score_audit_logger.outputs.upload }}
            ${{ needs.check_risk_score_tests_e2e.outputs.upload }}
            ${{ needs.check_risk_score_tests_playwright.outputs.upload }}

  comment_on_pr:
    runs-on: ubuntu-latest
    needs: fetch_results
    if: ${{ !cancelled() && needs.fetch_results.outputs.status != '' }}
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          MARKDOWN_TABLE: ${{ needs.fetch_results.outputs.markdown }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$MARKDOWN_TABLE" > "$RUNNER_TEMP/body.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body-file "$RUNNER_TEMP/body.md"

      - name: Fail on policy violation
        env:
          STATUS: ${{ needs.fetch_results.outputs.status }}
        run: |
          case "$STATUS" in
            pass|warn) echo "Dependency-Track status: $STATUS" ;;
            fail)      echo "::error::Dependency-Track policy violation (fail)"; exit 1 ;;
            *)         echo "::error::Unknown or missing status: '$STATUS'"; exit 1 ;;
          esac
