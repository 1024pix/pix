name: 'Security Checks'

## For readability and asynchronicity, the code for all 10 jobs is not in a loop

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths: # only loads on changes of dependencies
      - '**/package-lock.json'
      - '.github/workflows/security.yml'

permissions: {}

jobs:
  check_risk_score_monorepo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.riskscoreMonorepo.outputs.upload_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generates Monorepo SBoM and upload to OWASP DTrack
        id: riskscoreMonorepo
        uses: 1024pix/check-dependency-track-action/node@f2966ef0975c668c17b9a74022f21d9ad37eb2d6 # v1.0.0
        with:
          url: '${{ secrets.DEPENDENCYTRACK_URL }}'
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: '.'
          wait_for_status: 'false'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'

  check_risk_score_app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.riskscorePixApp.outputs.upload_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generates PixApp SBoM and upload to OWASP DTrack
